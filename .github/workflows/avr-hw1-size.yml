name: AVR HW1 size

on:
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

env:
  AVR_GCC_VERSION: "14.2.0"

jobs:
  size:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BoardComputer
    steps:
      - uses: actions/checkout@v4

      - name: Cache AVR toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/avr-gcc
          key: modm-avr-gcc-${{ env.AVR_GCC_VERSION }}

      - name: Install AVR toolchain
        working-directory: .
        env:
          AVR_GCC_INSTALL_DIR: ${{ runner.tool_cache }}/avr-gcc
        run: bash .github/scripts/install-avr-toolchain.sh

      - name: Add AVR toolchain to PATH
        env:
          AVR_GCC_INSTALL_DIR: ${{ runner.tool_cache }}/avr-gcc
        run: echo "${AVR_GCC_INSTALL_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Build HW_1
        run: make HW_1

      - name: Download previous size baseline
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .avr-size-baseline
          PREV_RUN=$(gh run list \
            --workflow .github/workflows/avr-hw1-size.yml \
            --branch master \
            --status success \
            --limit 5 \
            --json databaseId,headSha \
            --jq ".[] | select(.headSha != \"${{ github.sha }}\") | .databaseId" \
            | head -1)
          if [[ -n "${PREV_RUN}" ]]; then
            gh run download "${PREV_RUN}" -n avr-hw1-size -D .avr-size-baseline || true
          fi

      - name: Report firmware size
        working-directory: .
        run: |
          PREV=""
          if [[ -f .avr-size-baseline/size.json ]]; then
            PREV=".avr-size-baseline/size.json"
          fi
          bash .github/scripts/report-avr-size.sh BoardComputer/bin/BoardComputer.elf "${PREV}"

      - name: Upload size artifact
        uses: actions/upload-artifact@v4
        with:
          name: avr-hw1-size
          path: size.json
          if-no-files-found: error
