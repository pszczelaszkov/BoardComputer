# ATmega324PB: efuse bit 3 is CFD (Clock Failure Detection).
# Parent m324p only programs 3 BOD bits and forces bit3=1 (1111.1iii),
# which yields efuse 0xfc when enabling BOD and breaks CFD=disabled (0xf4).
# Match avrdude 8+ stock m324pb: 4-bit write + bitmask 0x0f.
part parent "m324p"
    id			= "m324pb";
    desc		= "ATmega324PB";
    signature		= 0x1e 0x95 0x17;
    ocdrev		= 3;

    memory "efuse"
        size = 1;
        initval = 0x07;
        bitmask = 0x0f;
        min_write_delay = 4500;
        max_write_delay = 4500;
        read = "0101.0000--0000.1000--xxxx.xxxx--oooo.oooo";
        write = "1010.1100--1010.0100--xxxx.xxxx--1111.iiii";
    ;
;
